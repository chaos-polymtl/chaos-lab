<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 90" width="110" height="90">
  <!-- neural network: 3 - 4 - 2 -->
  <g style="stroke:#000000;stroke-width:1;fill:none">
    <!-- input -> hidden -->
    <path d="M 18,20 L 55,14 M 18,20 L 55,36 M 18,20 L 55,58 M 18,20 L 55,76"/>
    <path d="M 18,45 L 55,14 M 18,45 L 55,36 M 18,45 L 55,58 M 18,45 L 55,76"/>
    <path d="M 18,70 L 55,14 M 18,70 L 55,36 M 18,70 L 55,58 M 18,70 L 55,76"/>
    <!-- hidden -> output -->
    <path d="M 55,14 L 92,32 M 55,36 L 92,32 M 55,58 L 92,32 M 55,76 L 92,32"/>
    <path d="M 55,14 L 92,58 M 55,36 L 92,58 M 55,58 L 92,58 M 55,76 L 92,58"/>
  </g>
  <g style="stroke:#000000;stroke-width:1.2">
    <!-- input layer -->
    <g style="fill:#cccccc">
      <circle cx="18" cy="20" r="6"/>
      <circle cx="18" cy="45" r="6"/>
      <circle cx="18" cy="70" r="6"/>
    </g>
    <!-- hidden layer -->
    <g style="fill:#aaffee">
      <circle cx="55" cy="14" r="6"/>
      <circle cx="55" cy="36" r="6"/>
      <circle cx="55" cy="58" r="6"/>
      <circle cx="55" cy="76" r="6"/>
    </g>
    <!-- output layer -->
    <g style="fill:#cccccc">
      <circle cx="92" cy="32" r="6"/>
      <circle cx="92" cy="58" r="6"/>
    </g>
  </g>
</svg>
